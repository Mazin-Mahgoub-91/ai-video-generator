<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>AI Video شغال</title>
<style>
body{background:#000;color:#0f0;font-family:tahoma;text-align:center;padding:15px}
textarea{width:80%;height:60px;background:#111;color:#0f0;border:2px solid #0f0;border-radius:8px;padding:8px;font-size:15px}
button{padding:12px 25px;font-size:16px;background:#0f0;color:#000;border:none;margin:5px;cursor:pointer;border-radius:8px;font-weight:bold}
#log{color:#0ff;margin-top:10px;font-size:14px;min-height:70px;white-space:pre-line}
video{margin-top:15px;border:3px solid #ff0;border-radius:10px;max-width:576px;display:none}
</style>
</head>
<body>
<h1>🎬 فيديو مجاني - CORS Fixed</h1>
<textarea id="prompt">ولد سوداني بيرقص في المطر ليلاً</textarea>
<br>
<button id="btnGenerate">ولد الفيديو</button>
<div id="log">اكتب البرومت واضغط</div>
<video id="output" controls></video>

<script>
const HF_API = 'https://api-inference.huggingface.co/models/stabilityai/stable-video-diffusion-img2vid-xt';
const TOKEN = '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';

function createSeedImage(prompt) {
  var canvas = document.createElement('canvas');
  canvas.width = 576; canvas.height = 320;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = prompt.includes('ليل')? '#0a0a2a' : '#87CEEB';
  ctx.fillRect(0,0,576,320);
  ctx.fillStyle = '#ffdbac';
  ctx.beginPath(); ctx.arc(288, 110, 22, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#00f'; ctx.fillRect(268, 132, 40, 90);
  return canvas.toDataURL('image/png').split(',')[1];
}

async function generateVideo(){
  var prompt = document.getElementById('prompt').value;
  var logBox = document.getElementById('log');
  var videoOut = document.getElementById('output');

  document.getElementById('btnGenerate').disabled = true;
  logBox.innerText = 'جاري التوليد عبر الـ Proxy...\nانتظر 50 ثانية';

  try {
    var seedImage = createSeedImage(prompt);
    var proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(HF_API);

    var response = await fetch(proxyUrl, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + TOKEN,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        inputs: seedImage,
        parameters: {prompt: prompt, num_frames: 25, fps: 8, motion_bucket_id: 127, cond_aug: 0.02}
      })
    });

    if(!response.ok) throw new Error('خطأ ' + response.status);

    var blob = await response.blob();
    videoOut.src = URL.createObjectURL(blob);
    videoOut.style.display = 'block';
    logBox.innerText = '✅ الفيديو جاهز!';

  } catch(e) {
    logBox.innerText = '❌ فشل: ' + e.message + '\nجرب الحل 2 لو ما ظبط';
  }
  document.getElementById('btnGenerate').disabled = false;
}

document.getElementById('btnGenerate').onclick = generateVideo;
</script>
</body>
</html>
