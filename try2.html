<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>AI Video Generator Fixed</title>
<style>
body{background:#000;color:#0f0;font-family:tahoma;text-align:center;padding:15px}
h1{color:#ff0;font-size:22px}
textarea{width:90%;height:60px;background:#111;color:#0f0;border:2px solid #0f0;border-radius:8px;padding:8px;font-size:15px}
button{padding:12px 25px;font-size:16px;background:#0f0;color:#000;border:none;margin:5px;cursor:pointer;border-radius:8px;font-weight:bold}
canvas{background:#000;border:3px solid #0f0;border-radius:10px;margin-top:10px;max-width:100%}
#log{color:#0ff;margin-top:8px;font-size:13px}
#preview{margin-top:10px}
</style>
</head>
<body>
<h1>🎬 مولد فيديو - نسخة ثابتة</h1>

<textarea id="prompt" placeholder="اكتب هنا: كرة حمراء بتنط + نص مرحبا"></textarea>
<br>
<button id="btnGen">ولد الفيديو</button>
<button id="btnDownload">نزل الفريمات</button>

<canvas id="canvas" width="640" height="480"></canvas>
<div id="log">جاهز...</div>
<div id="preview"></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const logBox = document.getElementById('log');
const btnGen = document.getElementById('btnGen');
const btnDownload = document.getElementById('btnDownload');

function log(msg){
  logBox.innerHTML = msg;
}

function parsePrompt(text){
  text = text.toLowerCase();
  return {
    hasPerson: text.indexOf('ولد') > -1 || text.indexOf('بنت') > -1,
    hasText: text.indexOf('نص') > -1,
    bg: text.indexOf('سماء') > -1? 'skyblue' : text.indexOf('بحر') > -1? 'blue' : 'black'
  };
}

function drawPerson(x, y, frame){
  ctx.fillStyle = '#ffdbac';
  ctx.beginPath();
  ctx.arc(x, y-40, 20, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#00f';
  ctx.fillRect(x-10, y-20, 20, 40);
  var leg = Math.sin(frame*0.3) * 15;
  ctx.fillRect(x-8, y+20, 8, 25);
  ctx.fillRect(x+leg, y+20, 8, 25);
}

var frames = [];

function generateVideo(){
  var prompt = document.getElementById('prompt').value;
  if(prompt === ''){
    alert('اكتب وصف أول');
    return;
  }

  var scene = parsePrompt(prompt);
  frames = [];
  var x = 320, y = 300, vx = 2, vy = -3;

  log('جاري توليد 60 فريم...');

  for(var i=0; i<60; i++){
    ctx.fillStyle = scene.bg;
    ctx.fillRect(0,0,640,480);

    if(scene.hasPerson){
      x = x + vx;
      y = y + vy;
      vy = vy + 0.15;
      if(x < 50 || x > 590) vx = vx * -1;
      if(y > 300){ y = 300; vy = vy * -0.7; }
      drawPerson(x, y, i);
    }

    if(scene.hasText){
      ctx.fillStyle = 'yellow';
      ctx.font = 'bold 40px Tahoma';
      ctx.textAlign = 'center';
      ctx.fillText('مرحبا', 320, 50);
    }

    frames.push(canvas.toDataURL('image/png'));

    if(i % 10 === 0){
      log('فريم ' + i + '/60 - ' + Math.floor(i/60*100) + '%');
    }
  }

  log('تم التوليد ✅ المعاينة تحت');
  document.getElementById('preview').innerHTML = '<img src="' + frames[0] + '" width="320">';
}

function downloadFrames(){
  if(frames.length === 0){
    alert('ولد الفيديو أول');
    return;
  }
  for(var i=0; i<frames.length; i++){
    var a = document.createElement('a');
    a.href = frames[i];
    a.download = 'frame_' + (i+1) + '.png';
    a.click();
  }
  alert('تم تنزيل ' + frames.length + ' صورة. ارفعهم في ezgif.com/maker عشان يبقو فيديو');
}

// ربط الأزرار بالكود - دي كانت المشكلة
btnGen.onclick = generateVideo;
btnDownload.onclick = downloadFrames;

log('الكود محمل وجاهز ✅');
</script>
</body>
</html>
